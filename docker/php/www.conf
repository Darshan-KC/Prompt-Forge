; php-fpm pool overrides for production (replaces the stock www.conf).
; clear_env=no is REQUIRED: without it php-fpm strips the environment and
; Laravel loses APP_KEY / DB_* / etc. inside workers.

[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000
pm.status_path = /status
ping.path = /ping

clear_env = no

request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
access.format = "[%t] %m %{REQUEST_URI}e %ds"
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
