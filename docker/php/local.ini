; =============================================================================
; LOCAL DEVELOPMENT php.ini overrides
; =============================================================================
; Priorities here are visibility and convenience, not performance:
; show every problem, tolerate heavy debug tooling, allow big test uploads.

; Headroom for Xdebug instrumentation + IDE round-trips, which inflate both
; memory and time per request.
memory_limit = 512M
max_execution_time = 120

; Generous upload limits for fixture files / seeded media during development.
upload_max_filesize = 64M
post_max_size = 64M

; Full error verbosity on screen — fail fast, fail loudly.
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2          ; also visible via `docker compose logs app`
error_reporting = E_ALL              ; even deprecations: catch issues early

; -----------------------------------------------------------------------------
; Xdebug — installed in Dockerfile.local but INACTIVE until XDEBUG_MODE says so
; -----------------------------------------------------------------------------
; The XDEBUG_MODE environment variable (set to "debug" in docker-compose.yml)
; overrides whatever is written here, so the same image serves "xdebug on"
; and plain fast development without rebuilding.
;
; With XDEBUG_MODE=debug + start_with_request=yes, every request attempts a
; connection to your IDE BEFORE executing (step debugging from first line).
[xdebug]
xdebug.client_host = host.docker.internal ; resolves to host via extra_hosts
xdebug.client_port = 9003            ; default Xdebug 3 IDE listen port
xdebug.discover_client_host = false  ; never trust forwarded headers for this
xdebug.idekey = PHPSTORM             ; match your IDE's debug key if it filters
xdebug.start_with_request = yes      ; trigger debug session per request
