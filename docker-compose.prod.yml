# =============================================================================
# PRODUCTION STACK
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requirements: a .env next to this file (or exported env vars) providing at
# minimum APP_KEY and DB_PASSWORD — the compose file FAILS FAST if DB_PASSWORD
# is missing instead of booting with an insecure default.
#
# Topology (who talks to whom):
#
#   internet ──> nginx :80 ──fastcgi──> app (php-fpm :9000) ──> postgres
#                    │ static files          │
#                    └── /build, /storage    ├──> queue     (queue:work)
#                                            └──> scheduler (schedule:work)
#
# - Postgres is NOT published to the host; only the app network reaches it.
# - app/queue/scheduler share ONE optimized image; only their commands differ.
# - Every service has a healthcheck so orchestrators (and compose depends_on
#   conditions) know real readiness, not just "process exists".
# =============================================================================

name: prompt-forge

services:
    # -------------------------------------------------------------------------
    # app — Laravel on php-fpm (dynamic requests)
    # -------------------------------------------------------------------------
    app:
        # Tagged image name: built once here, reused by queue/scheduler/assets-init.
        image: prompt-forge:latest
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        env_file:
            # Pulls secrets present at deploy time (APP_KEY, API keys...).
            # Keys repeated in `environment:` below always win. required:false
            # lets the entrypoint produce a CLEAR error if APP_KEY is missing,
            # rather than compose aborting with a generic message.
            - path: .env
              required: false

        environment:
            APP_ENV: production
            APP_DEBUG: "false"          # never leak stack traces publicly

            # Public base URL used for links/emails/assets. Set APP_URL in .env
            # when running behind a real domain.
            APP_URL: ${APP_URL:-http://localhost}

            DB_CONNECTION: pgsql
            DB_HOST: postgres           # service name = DNS name inside network
            DB_PORT: "5432"
            DB_DATABASE: ${DB_DATABASE:-promptforge}
            DB_USERNAME: ${DB_USERNAME:-promptforge}

            # ":?" syntax = hard failure with message when unset (no default!).
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (and APP_KEY) in .env}

            # Database-backed session/cache/queue: zero extra services to run.
            # Swap CACHE_STORE/QUEUE_CONNECTION to redis later by adding a
            # redis service — nothing else changes.
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database

            # Logs to stderr => captured by the Docker json-file driver below
            # and visible via `docker logs`; no log files inside the container.
            LOG_CHANNEL: stderr

            # Only the `app` service migrates. queue/scheduler start only after
            # app is healthy, guaranteeing schema is ready before workers run —
            # no distributed migration races.
            RUN_MIGRATIONS: "true"

            # Uncomment when TLS is terminated by a load balancer/CDN in front
            # of nginx so Laravel trusts X-Forwarded-* headers:
            # TRUSTED_PROXIES: "*"

        volumes:
            # Persistent user uploads across deploys/rebuilds. Code itself lives
            # IN the image (immutable); only user data is stateful.
            - storage_prod:/var/www/html/storage

        networks:
            - backend                   # internal side: postgres, queue, ...

        restart: unless-stopped         # self-heal crashes & host reboots

        logging: &default_logging
            driver: json-file
            options:
                max-size: 10m           # rotate instead of filling the disk
                max-file: 3             # keep 3 x 10MB per container

        healthcheck:
            # Deep check (see docker/healthcheck.php): critical env present,
            # PostgreSQL reachable, storage writable. Much stronger than a TCP
            # or process check.
            test: ["CMD", "php", "/opt/healthcheck.php"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 90s           # covers first-boot migrate + cache build

    # -------------------------------------------------------------------------
    # assets-init — one-shot job publishing static files for nginx
    # -------------------------------------------------------------------------
    # nginx runs in its own container WITHOUT application sources, so it has
    # nothing to serve for try_files. This job copies public/ (vite build
    # output, favicon, robots.txt, the storage symlink...) into a named volume
    # that nginx mounts read-only. Runs on every `up`, keeping the copy in sync
    # with newly built images.
    assets-init:
        image: prompt-forge:latest      # same image = same assets as the app runs
        user: "0:0"                     # volume dir is root-owned
        environment:
            # The entrypoint normally drops privileges for CLI commands;
            # copying into the volume requires root, so opt out explicitly.
            SKIP_PRIVILEGE_DROP: "true"
        command: sh -c "cp -a /var/www/html/public/. /srv/public/"
        volumes:
            - public_prod:/srv/public
        restart: "no"                   # job, not a daemon

    # -------------------------------------------------------------------------
    # nginx — web server / reverse proxy (static files + fastcgi to fpm)
    # -------------------------------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        ports:
            # Only entry point of the whole stack. Override with HTTP_PORT=8080
            # etc.; put a TLS load balancer in front for HTTPS in production.
            - "${HTTP_PORT:-80}:80"
        volumes:
            # Server block (read-only mount).
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            # Static asset tree written by assets-init (ro: nginx never writes).
            - public_prod:/var/www/html/public:ro
            # User uploads under storage/app/public served at /storage/...
            # Same volume the app writes to — appears once uploaded.
            - storage_prod:/var/www/html/storage:ro
        networks:
            - frontend                  # faces the internet
            - backend                   # needs fastcgi access to app:9000
        restart: unless-stopped
        logging: *default_logging       # YAML anchor: reuse app's logging config
        depends_on:
            # Static files exist before nginx serves them...
            assets-init:
                condition: service_completed_successfully
            # ...and PHP can answer before traffic flows (migrations done).
            app:
                condition: service_healthy
        healthcheck:
            # Full-stack probe: nginx -> fpm -> Laravel -> "Application up".
            # If ANY layer breaks, this container reports unhealthy.
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    # -------------------------------------------------------------------------
    # queue — asynchronous job worker (emails, broadcasts, long tasks...)
    # -------------------------------------------------------------------------
    queue:
        image: prompt-forge:latest      # identical image, different command
        command: php artisan queue:work --sleep=1 --tries=3 --backoff=5 --max-time=3600
        # --sleep=1      poll every second when idle
        # --tries=3      give up after 3 attempts
        # --backoff=5    wait 5s before retrying a failed job
        # --max-time=3600 exit gracefully after 1h; restart: brings a fresh
        #                 worker => prevents memory-leak drift over time

        env_file:
            - path: .env
              required: false
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_DATABASE: ${DB_DATABASE:-promptforge}
            DB_USERNAME: ${DB_USERNAME:-promptforge}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (and APP_KEY) in .env}
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            LOG_CHANNEL: stderr
        networks:
            - backend
        restart: unless-stopped
        logging: *default_logging
        depends_on:
            # Wait for migrations (via app health) — never race the schema.
            app:
                condition: service_healthy
        healthcheck:
            # Fails (=> container unhealthy) when pending jobs pile up beyond
            # 250, signalling stuck/slow workers rather than just a dead process.
            test: ["CMD-SHELL", "php artisan queue:monitor database:default --max=250"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    # -------------------------------------------------------------------------
    # scheduler — runs cron-style tasks (schedule:work ticks every minute)
    # -------------------------------------------------------------------------
    # Avoids installing a host crontab; the container lifecycle owns it.
    scheduler:
        image: prompt-forge:latest
        command: php artisan schedule:work
        env_file:
            - path: .env
              required: false
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_DATABASE: ${DB_DATABASE:-promptforge}
            DB_USERNAME: ${DB_USERNAME:-promptforge}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (and APP_KEY) in .env}
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            LOG_CHANNEL: stderr
        networks:
            - backend
        restart: unless-stopped
        logging: *default_logging
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            # schedule:work is a long-running daemon: "is the process alive?"
            # is exactly the right question here.
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # postgres — primary datastore
    # -------------------------------------------------------------------------
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-promptforge}
            POSTGRES_USER: ${DB_USERNAME:-promptforge}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}   # no default!
        volumes:
            - pgdata_prod:/var/lib/postgresql/data
        networks:
            - backend                   # NOT on frontend, NO published ports:
        restart: unless-stopped         # unreachable from outside the stack
        logging: *default_logging
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 3s
            retries: 12
            start_period: 20s

networks:
    frontend:   # internet-facing (nginx only)
    backend:
        # Deliberately NOT `internal: true`: the app must call external APIs.
        # Isolation for postgres comes from having no published ports instead.

volumes:
    pgdata_prod:    # database files — the most precious volume, never implicit
    storage_prod:   # user uploads, shared read-write (app) / read-only (nginx)
    public_prod:    # static build output, filled by assets-init, read by nginx
