; =============================================================================
; php-fpm pool "www" — PRODUCTION overrides
; =============================================================================
; Replaces the stock www.conf shipped with the official php-fpm image.
; The pool defines HOW worker processes are spawned and how they talk to
; nginx (which connects via fastcgi_pass app:9000).

[www]
user = www-data
group = www-data

; Listen on a TCP socket inside the compose network, not a unix socket:
; nginx lives in a DIFFERENT container and reaches fpm as host "app".
listen = 9000
listen.owner = www-data
listen.group = www-data

; -----------------------------------------------------------------------------
; Process manager — dynamic sizing
; -----------------------------------------------------------------------------
; Each child serves ONE request at a time. Sizing rule of thumb:
;   max_children ≈ available_ram / avg_request_memory (~50-80MB for Laravel)
; 20 children ≈ fits comfortably in ~1GB alongside the rest of the stack.
;
; dynamic keeps a warm pool: start_servers ready immediately at boot,
; shrinking to min_spare when idle, growing to max_spare under load.
pm = dynamic
pm.max_children = 20                 ; hard ceiling — protects against RAM exhaustion
pm.start_servers = 6                 ; spawned at startup (no cold-start spike)
pm.min_spare_servers = 4             ; never fewer idle than this (burst headroom)
pm.max_spare_servers = 10            ; reclaim idle workers beyond this

; Recycle each worker after N requests — cheap insurance against slow memory
; leaks in third-party code accumulating across long-lived processes.
pm.max_requests = 1000

; Introspection endpoints (NOT web routes): reachable only through the fpm
; port inside the network. Useful with tools like php-fpm-exporter for metrics.
pm.status_path = /status             ; pool state: active/idle/listen queue
ping.path = /ping                    ; trivial liveness reply ("pong")

; -----------------------------------------------------------------------------
; Environment passthrough — CRITICAL
; -----------------------------------------------------------------------------
; By default php-fpm SCRUBS the environment before spawning workers, which
; would erase APP_KEY / DB_* / everything Laravel needs. clear_env=no keeps
; the container environment intact so getenv()/$_SERVER work as expected.
clear_env = no

; Kill requests that run longer than PHP itself allows — a stuck request must
; never hold a worker hostage forever (matches max_execution_time headroom).
request_terminate_timeout = 120s

; Pipe worker output (echo, notices...) to fpm's stdout/stderr so it lands
; in `docker logs`; decorate=no keeps lines machine-parseable.
catch_workers_output = yes
decorate_workers_output = no

; Access log to stderr: one line per request (method, URI, duration) — handy
; without needing full nginx-style access logs.
access.log = /proc/self/fd/2
access.format = "[%t] %m %{REQUEST_URI}e %ds"

; Log requests slower than 5s with a PHP backtrace — pinpoints slow endpoints
; before users complain.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

php_admin_value[error_log] = /proc/self/fd/2   ; worker errors -> stderr too
php_admin_flag[log_errors] = on                ; cannot be turned off by apps
