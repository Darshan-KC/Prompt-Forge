; =============================================================================
; PRODUCTION php.ini overrides
; =============================================================================
; Shipped as $PHP_INI_DIR/conf.d/99-app.ini so it loads AFTER the stock
; defaults and only overrides what is listed here. Everything omitted keeps
; the upstream safe default.
;
; Values are chosen for a typical small-to-medium container deployment
; (roughly 1 vCPU / 512MB-1GB RAM per app replica). Scale accordingly.

; 256MB covers Livewire payloads and moderate file handling without letting
; one runaway request exhaust a small container.
memory_limit = 256M

; Must exceed nginx fastcgi_read_timeout (120s) so PHP finishes before the
; webserver cuts the connection.
max_execution_time = 60

; Matched with nginx client_max_body_size = 20M — both sides must agree or
; uploads fail confusingly at whichever limit hits first.
upload_max_filesize = 20M
post_max_size = 20M

; Never print errors to responses in production; send them to stderr where
; the Docker logging driver collects them (`docker logs`).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2          ; /proc/self/fd/2 == stderr of the process
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Don't advertise "X-Powered-By: PHP/8.3.x" — free information for attackers.
expose_php = Off

; Big realpath cache: Laravel resolves hundreds of paths per request through
; vendor/; caching stat() results measurably cuts syscall overhead.
realpath_cache_size = 4096K
realpath_cache_ttl = 600             ; code never changes mid-flight in an image
