; =============================================================================
; OPcache — PRODUCTION tuning
; =============================================================================
; OPcache keeps compiled PHP bytecode in shared memory, skipping the
; parse/compile step entirely on every request. It is the single largest
; low-effort performance win for PHP applications.
;
; In an immutable container image, application files can NEVER change while
; the container runs (new code = new image = new container), so all the
; "check if file changed" safety features are pure overhead and disabled.

opcache.enable = 1                   ; cache requests (web)
opcache.enable_cli = 0               ; long-lived CLI workers gain nothing and
                                     ; would hold stale bytecode after restarts

; 192MB of shared memory comfortably holds Laravel + vendor (~5-10k files).
; Monitor with opcache_get_status(); lower to ~128MB if barely used.
opcache.memory_consumption = 192

; Memory for strings deduplicated across files (class names, literals...).
; Laravel benefits noticeably from a larger buffer than the 8MB default.
opcache.interned_strings_buffer = 16

; Must exceed total script count (app + vendor ≈ 6-9k files); hitting this
; limit silently stops caching further scripts.
opcache.max_accelerated_files = 20000

; THE key production setting: never stat() source files for changes.
; Saves filesystem syscalls per request; safe because images are immutable —
; a rolling deploy replaces containers wholesale.
opcache.validate_timestamps = 0

; Keep doc comments: some packages read them via reflection at runtime
; (e.g. validation/lint tooling) — stripping them breaks those packages.
opcache.save_comments = 1

; -----------------------------------------------------------------------------
; JIT (just-in-time compilation) — enabled conservatively
; -----------------------------------------------------------------------------
; "tracing" compiles hot code paths to machine code. Gains are real but modest
; for typical I/O-bound web workloads (DB/network dominate); it mainly helps
; CPU-bound tasks (image processing, heavy computation).
; If memory pressure appears, set jit_buffer_size = 0 to disable cleanly.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
