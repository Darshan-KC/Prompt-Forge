# =============================================================================
# LOCAL DEVELOPMENT STACK
# =============================================================================
# Usage:      docker compose up --build
#
# What you get after startup:
#   App:      http://localhost:8000   Laravel via `artisan serve` (auto-reloads code)
#   Vite HMR: http://localhost:5173   hot module reload; laravel-vite-plugin detects
#                                     the "hot" file automatically, no config needed
#   Mailpit:  http://localhost:8025   web UI showing every email the app sends
#   Postgres: localhost:5433          exposed for GUI clients (TablePlus, DBeaver...)
#
# Port conflicts? Everything is overridable without editing this file:
#   APP_HOST_PORT=8100 VITE_HOST_PORT=5174 DB_HOST_PORT=5434 docker compose up
#
# Why a separate file instead of base + override?
#   Local and production differ fundamentally (bind mounts vs baked images,
#   artisan serve vs php-fpm + nginx). Two self-contained files are easier to
#   read and reason about than a layered merge.
# =============================================================================

# Fixed project name keeps container/volume/network names stable regardless
# of the folder name the repo is cloned into.
name: prompt-forge

services:
    # -------------------------------------------------------------------------
    # app — the Laravel application (PHP 8.3 + Xdebug)
    # -------------------------------------------------------------------------
    app:
        build:
            context: .                       # repo root = build context
            dockerfile: docker/php/Dockerfile.local

        # Run as your host user so files created inside the container
        # (logs, caches) are NOT owned by root on the host afterwards.
        # UID is exported by bash; GID usually defaults to 1000.
        user: "${UID:-1000}:${GID:-1000}"

        # PHP's built-in web server. Fine for development; production instead
        # uses php-fpm + nginx (see docker-compose.prod.yml).
        #
        # --env=container is IMPORTANT: `artisan serve` deliberately strips all
        # inherited environment variables from its request workers (so .env edits
        # hot-reload), which means compose `environment:` would never reach HTTP
        # requests. The entrypoint generates `.env.container` with correct values
        # (DB host "postgres", mailpit, ...) and this flag makes every request
        # load that file instead of the host-oriented .env.
        command: php artisan serve --env=container --host=0.0.0.0 --port=8000

        # Loads secrets/config that already exist on the host (APP_KEY above all).
        # required:false => fresh clones without .env still boot; the entrypoint
        # then generates a key. Values below override anything in the file.
        env_file:
            - path: .env
              required: false

        environment:
            # Loads .env.container (generated by the entrypoint) instead of
            # the host-oriented .env — required because `artisan serve`
            # strips inherited env vars from its request workers.
            APP_ENV: container

            # Full error pages + whoops traces while developing.
            APP_DEBUG: "true"

            # Let the entrypoint run `php artisan migrate` automatically on boot,
            # AFTER waiting for postgres to pass its own healthcheck.
            RUN_MIGRATIONS: "true"

            # Activate Xdebug (installed in the image but disabled by default).
            # Set to "off" here if step-debugging popups get annoying; the
            # IDE must listen on port 9003 (see local.ini for client settings).
            XDEBUG_MODE: debug

        ports:
            # host port : container port — publish overridable host side only.
            - "${APP_HOST_PORT:-8000}:8000"

        volumes:
            # Bind mount the whole repo: edit code on the host, refresh browser,
            # done. vendor/ comes from the host too (composer install runs there
            # or via `docker compose run --rm app composer install`).
            - .:/var/www/html

        extra_hosts:
            # On Linux, "host.docker.internal" does not resolve by default;
            # host-gateway maps it to the host IP so Xdebug can call back
            # to your IDE listening on the host.
            - "host.docker.internal:host-gateway"

        healthcheck:
            # /up is Laravel's built-in health endpoint (bootstrap/app.php).
            # Verifies the app actually boots and serves requests.
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null || exit 1"]
            interval: 15s       # check every 15s once running
            timeout: 5s         # fail a single probe after 5s
            retries: 10         # consecutive failures before marking unhealthy
            start_period: 60s   # grace window for boot (composer install, migrate)

        depends_on:
            # service_healthy (not just service_started!) waits until postgres
            # ACCEPTS connections, preventing "connection refused" race conditions
            # during `docker compose up`.
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_healthy

    # -------------------------------------------------------------------------
    # vite — frontend dev server with hot module replacement
    # -------------------------------------------------------------------------
    vite:
        # Matches "vite": "^8" in package.json (requires Node >= 20.19 / 22.12).
        image: node:22-alpine
        working_dir: /app

        # Runs as root because the node_modules named volume is created
        # root-owned and uid 1000 could not write into it; HOME/npm_config_cache
        # are redirected to /tmp so nothing root-owned leaks into the bind mount.
        environment:
            HOME: /tmp
            npm_config_cache: /tmp/.npm
            # Browser-facing URL for HMR + asset links. Must be the EXTERNAL
            # address (published host port), since the browser resolves it.
            VITE_ORIGIN: ${VITE_ORIGIN:-http://localhost:${VITE_HOST_PORT:-5173}}

        # npm install (not ci) tolerates a missing lockfile and reuses one when
        # present. --host makes Vite listen on all interfaces inside the
        # container; server.origin in vite.config.js handles the public URL.
        command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

        volumes:
            - .:/app                          # live source code
            # Named volume shadows the host node_modules: dependencies are
            # installed ONCE into the volume, isolated from any host npm state,
            # and survive container rebuilds.
            - node_modules:/app/node_modules

        ports:
            - "${VITE_HOST_PORT:-5173}:5173"

        healthcheck:
            # @vite/client is the script every Vite dev page injects — a cheap
            # "is the dev server really serving?" probe.
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/@vite/client"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s # npm install may take a while on first boot

    # -------------------------------------------------------------------------
    # postgres — primary datastore (replaces SQLite)
    # -------------------------------------------------------------------------
    postgres:
        image: postgres:17-alpine

        environment:
            # Credentials mirror the app's defaults so both sides agree even on
            # a bare checkout. Override via host env/.env if desired.
            POSTGRES_DB: ${DB_DATABASE:-promptforge}
            POSTGRES_USER: ${DB_USERNAME:-promptforge}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

        ports:
            # Default host port is 5433 because developers often already run a
            # local PostgreSQL on 5432. Container-internal traffic always uses
            # 5432; only this published side is configurable.
            - "${DB_HOST_PORT:-5433}:5432"

        volumes:
            # Named volume = data survives down/up, rebuilds, and re-clones.
            - pgdata_local:/var/lib/postgresql/data

        healthcheck:
            # pg_isready returns success only when the server accepts connections
            # for THIS database+user — exactly what the app needs before starting.
            # $$ escapes compose interpolation so the variable resolves INSIDE
            # the container at runtime, not at parse time.
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s      # aggressive polling: app startup waits on this
            timeout: 3s
            retries: 12
            start_period: 10s

    # -------------------------------------------------------------------------
    # mailpit — fake SMTP server + web inbox (catches ALL outgoing mail)
    # -------------------------------------------------------------------------
    mailpit:
        # Pinned minor version for reproducible local setups.
        image: axllent/mailpit:v1.24
        ports:
            # Only the web UI is published; SMTP (:1025) stays internal —
            # the app reaches it via the compose network as host "mailpit".
            - "${MAILPIT_HOST_PORT:-8025}:8025"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/"]
            interval: 10s
            timeout: 3s
            retries: 6

volumes:
    pgdata_local:    # database files
    node_modules:    # JS dependencies, seeded once, reused across rebuilds
