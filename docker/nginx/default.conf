# =============================================================================
# NGINX server block — PRODUCTION
# =============================================================================
# Role in the stack (see docker-compose.prod.yml):
#   1. single internet entry point (:80)
#   2. serves STATIC files directly (vite build, uploads) — never bothering PHP
#   3. forwards dynamic requests to php-fpm in the app container via FastCGI
#
# NOTE: nginx runs in its OWN container and has no PHP sources on disk.
# Static files arrive through read-only volume mounts; PHP paths below are
# passed as literal strings to fpm, which resolves them inside the app
# container. That split is why $document_root (not $realpath_root) is used.
# =============================================================================

server {
    listen 80;
    server_name _;                   # accept any Host header (LB/IP access)

    # -----------------------------------------------------------------------------
    # upstream resolution — Docker-aware
    # -----------------------------------------------------------------------------
    # A literal `fastcgi_pass app:9000;` resolves the hostname ONCE at startup;
    # if only the app container is later recreated (new internal IP), nginx
    # keeps proxying to a dead address. Using Docker's embedded DNS resolver
    # (127.0.0.11) through a VARIABLE defers resolution to request time and
    # re-resolves every 10s — nginx transparently follows container changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_upstream app;

    # Document root INSIDE THE NGINX CONTAINER — populated from the app image
    # by the assets-init one-shot job into a named volume.
    root /var/www/html/public;
    index index.php;

    # Must match PHP's post_max_size/upload_max_filesize (docker/php/prod.ini);
    # otherwise large uploads die here with 413 before reaching Laravel.
    client_max_body_size 20M;

    charset utf-8;

    # -----------------------------------------------------------------------------
    # gzip — compress text-like responses on the fly
    # -----------------------------------------------------------------------------
    gzip on;
    gzip_vary on;                    # tells caches a compressed variant exists
    gzip_comp_level 5;               # 1-9: 5 ≈ best size/CPU trade-off
    gzip_min_length 256;             # don't bother compressing tiny bodies
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;
        # Note: already-compressed binaries (jpg/png/mp4) are excluded —
        # compressing them wastes CPU for ~0% gain.

    # -----------------------------------------------------------------------------
    # static assets — served straight from disk, never touching PHP
    # -----------------------------------------------------------------------------
    # /build/* filenames contain content hashes (app-BvRk9kiK.js): content
    # changes => name changes => "immutable" caching is always correct.
    location /build {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # User-uploaded files (public/storage -> storage/app/public). Freshness
    # matters more than caching here, hence the short window.
    location /storage {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Don't spam logs for these two ultra-common missing-file probes.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Basic security headers on every response.
    add_header X-Content-Type-Options nosniff always;   # no MIME sniffing
    add_header X-Frame-Options SAMEORIGIN always;       # anti-clickjacking
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # -----------------------------------------------------------------------------
    # routing — everything dynamic funnels to Laravel's front controller
    # -----------------------------------------------------------------------------
    location / {
        # Real file? serve it. Directory? index. Anything else -> index.php,
        # where Laravel's router decides (pages, API, 404s...).
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $fpm_upstream:9000;   # variable => resolved via Docker DNS
        fastcgi_index index.php;
        include fastcgi_params;      # standard CGI variable set

        # Paths are resolved inside the APP container, not here — nginx
        # intentionally has no PHP sources on disk ($document_root is used
        # as a literal string, no stat() involved). Using $realpath_root here
        # would fail: that file doesn't exist in the nginx container.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;   # strip PHP version leak from fpm

        # Laravel responses can exceed default buffers (~8k); larger buffers
        # prevent "upstream sent too big header" errors on heavy pages.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;

        # Allow long-running requests (report exports etc.) — kept in sync
        # with PHP max_execution_time and fpm request_terminate_timeout.
        fastcgi_read_timeout 120s;
    }

    # Deny access to dotfiles (.env would be catastrophic!) except ACME
    # challenges used by certificate authorities like Let's Encrypt.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
