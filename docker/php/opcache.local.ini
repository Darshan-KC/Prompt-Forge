; =============================================================================
; OPcache — LOCAL DEVELOPMENT tuning
; =============================================================================
; Same idea as production (skip recompiling PHP on every request) with one
; crucial difference: source files change constantly during development, so
; the cache must detect changes IMMEDIATELY or you debug stale code.

opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 128     ; default-ish; plenty for dev
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000

; validate_timestamps=1 + revalidate_freq=0:
; check EVERY request whether any file changed and recompile if so. This is
; exactly what you want locally (instant code feedback) and exactly what you
; never want in production (see opcache.prod.ini: validate_timestamps=0).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
